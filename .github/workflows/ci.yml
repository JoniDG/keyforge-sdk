name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    name: Test (Go SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: ./go/go.sum
      - name: Build
        run: go build ./...
      - name: Run tests
        run: |
          if [[ -z "$(find . -name '*_test.go' 2>/dev/null)" ]]; then
            echo "No tests yet — skipping coverage gate. Add tests as soon as logic lands."
            exit 0
          fi
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate (≥95%)
        if: hashFiles('go/coverage.out') != ''
        run: |
          coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 95) { print "::error::Coverage "c"% is below the 95% minimum"; exit 1 } }'

  examples-go:
    name: Examples (Go, ${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [toggle, echo, spotify, counter]
    defaults:
      run:
        working-directory: ./examples/go/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: ./examples/go/${{ matrix.example }}/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      # Always the latest release; `make lint-examples` fails locally when the installed
      # one falls behind it, so both run the same version.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ./examples/go/${{ matrix.example }}
          args: --config ../../../go/.golangci.yml

  lint-go:
    name: Lint (Go SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: ./go/go.sum
      # Always the latest release; `make lint` fails locally when the installed
      # one falls behind it, so both run the same version.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ./go

  test-node:
    name: Test (Node SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./node/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # The coverage gate (≥95%) is enforced by the thresholds in vitest.config.ts.
      - name: Run tests
        run: npm test

  lint-node:
    name: Lint (Node SDK and examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./node/package-lock.json
      - run: npm ci
      - name: Lint SDK
        run: npm run lint
      # The examples share the SDK's ESLint and Prettier config.
      - name: Lint examples
        run: npm run lint:examples

  examples-node:
    name: Examples (Node, ${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [counter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ./node/package-lock.json
            ./examples/node/${{ matrix.example }}/package-lock.json
      # The examples depend on the SDK through file:../../../node, which
      # resolves to its build output.
      - name: Build SDK
        working-directory: ./node
        run: npm ci && npm run build
      - name: Install
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm ci
      - name: Typecheck
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm run typecheck
      - name: Test
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm test
      - name: Build
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm run build
