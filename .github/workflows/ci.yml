name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    name: Test (Go SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: ./go/go.sum
      - name: Build
        run: go build ./...
      - name: Run tests
        run: |
          if [[ -z "$(find . -name '*_test.go' 2>/dev/null)" ]]; then
            echo "No tests yet — skipping coverage gate. Add tests as soon as logic lands."
            exit 0
          fi
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate (≥95%)
        if: hashFiles('go/coverage.out') != ''
        run: |
          coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 95) { print "::error::Coverage "c"% is below the 95% minimum"; exit 1 } }'

  examples-go:
    name: Examples (Go, ${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [toggle, echo, spotify, counter]
    defaults:
      run:
        working-directory: ./examples/go/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: ./examples/go/${{ matrix.example }}/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      # Always the latest release; `make lint-examples` fails locally when the installed
      # one falls behind it, so both run the same version.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ./examples/go/${{ matrix.example }}
          args: --config ../../../go/.golangci.yml

  lint-go:
    name: Lint (Go SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: ./go/go.sum
      # Always the latest release; `make lint` fails locally when the installed
      # one falls behind it, so both run the same version.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ./go

  test-node:
    name: Test (Node SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./node/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # The coverage gate (≥95%) is enforced by the thresholds in vitest.config.ts.
      - name: Run tests
        run: npm test

  lint-node:
    name: Lint (Node SDK and examples)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./node/package-lock.json
      - run: npm ci
      - name: Lint SDK
        run: npm run lint
      # The examples share the SDK's ESLint and Prettier config.
      - name: Lint examples
        run: npm run lint:examples

  examples-node:
    name: Examples (Node, ${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [counter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ./node/package-lock.json
            ./examples/node/${{ matrix.example }}/package-lock.json
      # The examples depend on the SDK through file:../../../node, which
      # resolves to its build output.
      - name: Build SDK
        working-directory: ./node
        run: npm ci && npm run build
      - name: Install
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm ci
      - name: Typecheck
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm run typecheck
      - name: Test
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm test
      - name: Build
        working-directory: ./examples/node/${{ matrix.example }}
        run: npm run build

  test-python:
    name: Test (Python SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v4
      # uv installs the Python in python/.python-version (always the latest).
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
      # The coverage gate (≥95%) is enforced by fail_under in pyproject.toml.
      - name: Run tests
        run: uv run pytest
      - name: Build
        run: uv build

  lint-python:
    name: Lint (Python SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests

  examples-python:
    name: Examples (Python, ${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [counter]
    defaults:
      run:
        working-directory: ./examples/python/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: examples/python/${{ matrix.example }}/uv.lock
      - run: uv sync --locked
      - name: Test
        run: uv run pytest
      # The examples share the SDK's ruff config through `extend`.
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
      # Packages the plugin the way python/README.md describes and runs it
      # outside the venv: it must find every dependency in vendor/ and stop
      # because it wasn't launched by the daemon.
      - name: Vendor and run
        run: |
          uv export --no-dev --no-emit-project --no-hashes --frozen | uv pip install --target vendor -r -
          out=$("$(uv python find --system 3.15)" main.py 2>&1) && exit 1
          echo "$out"
          grep -q 'KEYFORGE_PLUGIN_INFO is not set' <<<"$out"
