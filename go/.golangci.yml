version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    forbidigo:
      forbid:
        - pattern: "^interface\\{\\}$"
          msg: "use a concrete type or a typed interface; interface{} is forbidden"
        - pattern: "^any$"
          msg: "use a concrete type or a typed interface; any is forbidden"
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
